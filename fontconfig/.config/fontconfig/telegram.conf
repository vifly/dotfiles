<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

  <match target="pattern">
    <test name="prgname">
      <string>Telegram</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="prgname">
      <string>Telegram</string>
    </test>
    <test name="family">
      <string>Noto Sans</string>
    </test>
    <test name="weight" compare="less_eq">
      <int>80</int>
    </test>
    <edit name="weight" mode="assign">
      <int>100</int>
    </edit>
  </match>

  <!-- 仅对 Telegram 内的 Noto Sans CJK SC 提升字重至 Medium -->
  <match target="pattern">
    <test name="prgname">
      <string>Telegram</string>
    </test>
    <test name="family">
      <string>Noto Sans CJK SC</string>
    </test>
    <test name="weight" compare="less_eq">
      <int>80</int>
    </test>
    <edit name="weight" mode="assign">
      <int>100</int>
    </edit>
  </match>

</fontconfig>
